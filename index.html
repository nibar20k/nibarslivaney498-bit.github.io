<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Official profile of Nibar Slivanay, a developer, actor, and security professional based in Luxembourg.">
    <meta name="robots" content="index, follow">
    <meta property="og:type" content="profile">
    <meta property="og:title" content="Nibar Slivanay | Developer, Actor & Security">
    <meta property="og:description" content="Official profile of Nibar Slivanay, based in Luxembourg.">
    <title>Nibar Slivanay | Developer, Actor & Security</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Nibar Slivanay",
        "description": "Developer, actor, and security professional based in Luxembourg.",
        "jobTitle": ["Developer", "Actor", "Security Professional"],
        "homeLocation": {
          "@type": "Place",
          "name": "Luxembourg"
        },
        "sameAs": ["https://www.instagram.com/nibar_slivany/"]
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --ink: #f7f8fc;
        --muted: #b4b8c9;
        --line: rgba(255, 255, 255, .16);
        --accent: #9cf2d5;
        --deep: #10111c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 12% 15%, rgba(94, 89, 255, .35), transparent 36rem),
          radial-gradient(circle at 92% 85%, rgba(29, 195, 147, .25), transparent 31rem),
          var(--deep);
        color: var(--ink);
        font: 16px/1.5 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: min(100% - 40px, 760px); padding: 48px 0; }
      .card {
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid var(--line);
        border-radius: 28px;
        background: rgba(16, 17, 28, .68);
        box-shadow: 0 28px 80px rgba(0, 0, 0, .35);
        backdrop-filter: blur(14px);
      }
      .eyebrow {
        margin: 0 0 22px;
        color: var(--accent);
        font-size: .75rem;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(2.8rem, 10vw, 5.8rem); line-height: .94; letter-spacing: -.065em; }
      .roles { margin: 26px 0 0; font-size: clamp(1.1rem, 2.8vw, 1.45rem); color: var(--muted); }
      .roles strong { color: var(--ink); font-weight: 650; }
      .location { margin: 12px 0 40px; color: var(--muted); }
      a {
        display: inline-flex;
        align-items: center;
        gap: .5rem;
        padding: 14px 19px;
        border-radius: 999px;
        background: var(--accent);
        color: #09251e;
        font-weight: 800;
        text-decoration: none;
        transition: transform .18s ease, box-shadow .18s ease;
      }
      a:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(156, 242, 213, .25); }
      footer { padding: 20px 4px 0; color: var(--muted); font-size: .83rem; }
    </style>
  </head>
  <body>
    <main>
      <section class="card" aria-labelledby="name">
        <p class="eyebrow">Official profile · Luxembourg</p>
        <h1 id="name">Nibar<br>Slivanay</h1>
        <p class="roles"><strong>Developer</strong> · <strong>Actor</strong> · <strong>Security</strong></p>
        <p class="location">Based in Luxembourg</p>
        <a href="https://www.instagram.com/nibar_slivany/" rel="me noopener noreferrer" target="_blank">Follow on Instagram <span aria-hidden="true">↗</span></a>
      </section>
      <footer>© Nibar Slivanay</footer>
    </main>
  </body>
</html>
